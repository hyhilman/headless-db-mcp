name: Docker Publish

# Builds the GHCR image for any v* tag pushed by a human (manual releases,
# backfills). Merges to main are handled by release.yml, which tags and
# builds on its own; this covers the manual-tag path.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-image.yml
    with:
      ref: ${{ github.ref }}
      version: ${{ github.ref_name }}
